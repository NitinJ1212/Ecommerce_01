version: "3.9"

services:
  backend:
    build: .
    container_name: ecommerce-backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      - mongo
      - redis
    networks:
      - ecommerce-networks

  frontend:
      build: ../frontend
      container_name: ecommerce-frontend
      ports:
        - "3002:3002"
      volumes:
        - ../frontend:/app
        - /app/node_modules
      environment:
        - CHOKIDAR_USEPOLLING=true
      depends_on:
        - backend
      networks:
        - ecommerce-networks
  
  mongo:
    image: mongo:6
    container_name: ecommerce-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - ecommerce-networks

  redis:
    image: redis:7
    container_name: redis
    networks:
      - ecommerce-networks

networks:
  ecommerce-networks:
    driver: bridge

volumes:
  mongo-data:
